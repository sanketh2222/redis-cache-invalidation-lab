services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: appsecret
      POSTGRES_DB: products_practice
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d products_practice"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-64mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  api1:
    profiles: ["dual-api"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "src/server.js"]
    environment:
      PORT: 3000
      INSTANCE_ID: api-1
      DATABASE_URL: postgresql://app:appsecret@postgres:5432/products_practice
      REDIS_URL: redis://redis:6379
      CACHE_WARM_ON_STARTUP: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  api2:
    profiles: ["dual-api"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "src/server.js"]
    environment:
      PORT: 3000
      INSTANCE_ID: api-2
      DATABASE_URL: postgresql://app:appsecret@postgres:5432/products_practice
      REDIS_URL: redis://redis:6379
      CACHE_WARM_ON_STARTUP: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"

  lb:
    profiles: ["dual-api"]
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2

volumes:
  pgdata:
